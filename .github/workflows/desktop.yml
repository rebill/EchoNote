name: Desktop

on:
  push:
    branches:
      - main
      - "release/**"
      - "feat/standalone-app"
    paths:
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/dev/**"
      - "third_party/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches:
      - main
    paths:
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/dev/**"
      - "third_party/**"
      - ".github/workflows/desktop.yml"
  # release.yml runs these checks before it builds installers.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/.sherpa-onnx

jobs:
  core:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Cache sherpa-onnx archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .sherpa-onnx
          key: sherpa-onnx-2.0.1-${{ matrix.target }}

      - name: Fetch sherpa-onnx archive
        run: python scripts/dev/fetch_sherpa_onnx.py .sherpa-onnx ${{ matrix.target }}

      # The app crate embeds app/dist, so the frontend is built before any cargo step.
      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Script tests
        working-directory: scripts/dev
        run: python -m unittest discover -s tests

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

      # Deterministic synthetic fixtures with a fixed decode-cost model; see
      # crates/echonote-bench/src/gate.rs.
      - name: Regression gates
        run: cargo run --locked -p echonote-bench -- gate --report gate-report.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-report-${{ matrix.target }}
          path: gate-report.json
          if-no-files-found: ignore
