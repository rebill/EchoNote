[package]
name = "echonote-core"
description = "EchoNote engine: audio pipeline, VAD, ASR scheduling, storage and LLM integration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
default = ["static"]
static = ["sherpa-onnx/static"]
shared = ["sherpa-onnx/shared"]

[dependencies]
cpal = "0.18.2"
echonote-opus = { path = "../echonote-opus" }
hound.workspace = true
rtrb = "0.3.6"
rubato = "4.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sherpa-onnx.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# Needed by `#[implement]` (the WASAPI activation callback).
windows-core = "0.62.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
