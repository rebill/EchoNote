[package]
name = "echonote-app"
description = "EchoNote desktop app shell (Tauri 2)"
version.workspace = true
edition.workspace = true
# Tauri 2.12 needs 1.90.
rust-version = "1.90"
license-file.workspace = true
repository.workspace = true
publish = false

[lib]
name = "echonote_app"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
echonote-core = { path = "../../crates/echonote-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
# `tauri build` turns this on to embed the frontend; `cargo build` alone uses the dev server.
custom-protocol = ["tauri/custom-protocol"]
