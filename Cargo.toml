[workspace]
resolver = "3"
members = [
    "crates/echonote-core",
    "crates/echonote-bench",
    "crates/echonote-llm",
    "crates/echonote-opus",
    "app/src-tauri",
]
# `cargo test` without --workspace skips the app, which needs `pnpm build` (app/dist) first.
default-members = [
    "crates/echonote-core",
    "crates/echonote-bench",
    "crates/echonote-llm",
    "crates/echonote-opus",
]

[workspace.package]
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license-file = "License"
repository = "https://github.com/rebill/EchoNote"

[workspace.dependencies]
anyhow = "1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = { version = "=2.0.1", default-features = false }
thiserror = "2"

# The capture thread runs the Opus encoder and the resampler; keep them optimized in debug
# builds too.
[profile.dev.package.echonote-opus]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench-release]
inherits = "release"
strip = "none"
debug = "line-tables-only"
